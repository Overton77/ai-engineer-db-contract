format: ai-engineer-workspace-enrichment/1
terms:
  - slug: knowledge-head
    term: knowledge head
    aliases: [head, knowledge_seq, K]
    definition: Per-tenant monotonic sequence of sealed knowledge batches. Every snapshot and ingestion intent cites it; begin_batch fails rebase_required when the expected head does not match.
    refs: [temporal.knowledge_head, temporal.begin_batch, q:knowledge.head]
    provenance: model_assisted
    reviewed: null
  - slug: knowledge-batch
    term: knowledge batch
    aliases: [batch, sealed batch]
    definition: One committed admission transaction. commit_batch writes a knowledge_batch row with a receipt, idempotency key, and input digest, then advances the tenant head by one.
    refs: [temporal.knowledge_batch, temporal.commit_batch, temporal.begin_batch]
    provenance: model_assisted
    reviewed: null
  - slug: segment
    term: segment
    aliases: [fact, temporal fact, state segment]
    definition: One assertion of a fact on a stream. Carries a world interval valid_during and a knowledge interval [k_from, k_to). Current means k_to is null.
    refs: [temporal.segment, temporal.assert_state, q:facts.current_by_stream]
    provenance: model_assisted
    reviewed: null
  - slug: stream
    term: stream
    aliases: [fact series, stream slot]
    definition: The identity of a fact series, unique on (kind, subject entity or relationship, scope_key). Segments stack on a stream; overlapping current segments are forbidden.
    refs: [temporal.stream, temporal.stream_kind, q:facts.history_for_stream]
    provenance: model_assisted
    reviewed: null
  - slug: extent
    term: extent
    aliases: [date extent, temporal extent]
    definition: Source text for a date with precision (instant, day, month, quarter, year, relative, unknown) and optional earliest/latest bounds. Required when temporal_basis is explicit or carry_forward.
    refs: [temporal.extent, temporal.make_extent]
    provenance: model_assisted
    reviewed: null
  - slug: world-time
    term: world time
    aliases: [valid_during, occurred_during, as-of date]
    definition: When the world was like this. Stored as a tstzrange bounded below with [) bounds. Distinct from when we came to know it.
    refs: [temporal.segment, q:entity.at]
    provenance: model_assisted
    reviewed: null
  - slug: knowledge-time
    term: knowledge time
    aliases: [k_from, k_to, knowledge interval]
    definition: When a fact was admitted or closed. Stamped from the open batch. Current rows have k_to null; closed rows keep history.
    refs: [temporal.segment, temporal.stamp_k, q:entity.what_changed]
    provenance: model_assisted
    reviewed: null
  - slug: two-clocks
    term: two clocks
    aliases: [bitemporal, two-clock]
    definition: World time and knowledge time together. entity.at(entity, T, K) answers what was true at T as we knew it at K.
    refs: [temporal.segment, q:entity.at, q:knowledge.head]
    provenance: model_assisted
    reviewed: null
  - slug: canonical-entity
    term: canonical entity
    aliases: [entity, identity row]
    definition: One row in corpus.entity. kind picks the typed child table. lifecycle is active, merged, or retired. Typed attributes live in corpus.<kind>, not on the identity row.
    refs: [corpus.entity, taxonomy.entity_kind, q:entity.resolve]
    provenance: model_assisted
    reviewed: null
  - slug: alias
    term: alias
    aliases: [entity alias, synonym]
    definition: A typed alternate name (synonym, acronym, former_name, handle, ticker, slug, misspelling, translation, model_alias). Unique per (entity, normalized alias, alias_kind), not globally unique across entities.
    refs: [corpus.entity_alias, q:entity.resolve]
    provenance: model_assisted
    reviewed: null
  - slug: identifier
    term: identifier
    aliases: [external id, scheme]
    definition: A schemed external identifier. scheme is a closed check-constraint vocabulary. Unique per tenant on (scheme, value), so one identifier names at most one entity.
    refs: [corpus.entity_identifier, q:entity.by_identifier]
    provenance: model_assisted
    reviewed: null
  - slug: support
    term: support
    aliases: [segment support, admitted support]
    definition: A k-stamped link from a claim and locator to a segment or event occurrence. Written only through temporal.admit_support inside an open batch.
    refs: [evidence.segment_support, temporal.admit_support, q:evidence.claim_support]
    provenance: model_assisted
    reviewed: null
  - slug: claim
    term: claim
    aliases: [evidence claim]
    definition: An atomic statement with claim_type, status, and created_by_receipt_id. Facts may cite a claim as primary_claim_id. Subjects are attached via claim_subject roles subject, object, or context.
    refs: [evidence.claim, evidence.claim_subject, q:evidence.claims_for_entity]
    provenance: model_assisted
    reviewed: null
  - slug: evidence-packet
    term: evidence packet
    aliases: [packet]
    definition: A retrieval-assembled bundle of members (chunks, records, locators, timecodes) for one question. Read with api.evidence_packet.
    refs: [retrieval.evidence_packet, retrieval.packet_member, q:retrieval.evidence_packet]
    provenance: model_assisted
    reviewed: null
  - slug: assurance
    term: assurance
    aliases: [assurance level, assurance_rank]
    definition: How strongly a knowledge record or vector item is backed. knowledge.assurance_level is the vocabulary; retrieval filters accept a minimum assurance rank.
    refs: [knowledge.assurance_level, knowledge.record, retrieval.vector_item]
    provenance: model_assisted
    reviewed: null
  - slug: admission
    term: admission
    aliases: [admit, admitted]
    definition: Executor decision that a proposal becomes a canonical fact through the temporal helpers. Distinct from receipt outcome applied and from blueprint outcomes such as review_required or held.
    refs: [temporal.assert_state, temporal.commit_batch, orchestration.operation_receipt]
    provenance: model_assisted
    reviewed: null
  - slug: staging-candidate
    term: staging candidate
    aliases: [candidate]
    definition: An unresolved proposed identity. Not a staging copy of a fact. Resolution decisions are create, match, reject, or defer; vetting decisions are admit, reject, or defer.
    refs: [staging.candidate, staging.resolution_decision, q:staging.unresolved]
    provenance: model_assisted
    reviewed: null
  - slug: receipt
    term: receipt
    aliases: [operation receipt]
    definition: Immutable orchestration.operation_receipt for one intent. Outcome is applied, rejected, noop, or partial. Facts and entities require a receipt id before they can be written.
    refs: [orchestration.operation_receipt, orchestration.operation_intent, q:receipts.for_intent]
    provenance: model_assisted
    reviewed: null
  - slug: artifact
    term: artifact
    aliases: [stored artifact]
    definition: Content-addressed stored object (sha256, bucket_class, storage_bucket, object_path) typed by artifact_type. Lineage edges record derived_from, supersedes, corrects, produced_by, consumed_by.
    refs: [orchestration.artifact, orchestration.artifact_lineage, q:artifacts.by_type]
    provenance: model_assisted
    reviewed: null
  - slug: intent
    term: intent
    aliases: [operation intent]
    definition: A durable proposed operation. knowledge-read-intent.v1 and knowledge-ingestion-intent.v1 are the workspace contracts; the ledger row is orchestration.operation_intent with an idempotency_key.
    refs: [orchestration.operation_intent, orchestration.intent_type]
    provenance: model_assisted
    reviewed: null
  - slug: idempotency-key
    term: idempotency key
    aliases: [idempotencyKey]
    definition: Unique per tenant on operation_intent and knowledge_batch. A second submit of the same bytes returns the existing receipt as duplicate_of.
    refs: [orchestration.operation_intent, temporal.knowledge_batch]
    provenance: model_assisted
    reviewed: null
  - slug: rebase-required
    term: rebase_required
    aliases: [REBASE_REQUIRED, stale head]
    definition: Transaction failure (SQLSTATE 40001) from begin_batch when expected head does not match the locked knowledge_head. Not a per-proposal outcome.
    refs: [temporal.begin_batch, temporal.knowledge_head, q:entity.what_changed]
    provenance: model_assisted
    reviewed: null
  - slug: vocabulary
    term: vocabulary
    aliases: [reference data, kind table]
    definition: Allowlisted code tables such as taxonomy.entity_kind, taxonomy.relationship_kind, temporal.stream_kind, and identifier schemes. Slot rules and endpoint kinds are enforced at write time.
    refs: [taxonomy.entity_kind, taxonomy.relationship_kind, temporal.stream_kind, q:vocab.stream_kind]
    provenance: model_assisted
    reviewed: null
  - slug: entity-kind
    term: entity kind
    aliases: [kind]
    definition: taxonomy.entity_kind.code. Points at canonical_schema/canonical_table. corpus.entity.kind is a foreign key; unknown kinds cannot be inserted.
    refs: [taxonomy.entity_kind, corpus.entity]
    provenance: model_assisted
    reviewed: null
  - slug: relationship-kind
    term: relationship kind
    aliases: [rel kind]
    definition: taxonomy.relationship_kind.code with from_kinds, to_kinds, temporal flag, and property_schema. Trigger corpus.check_relationship_kinds rejects illegal endpoints.
    refs: [taxonomy.relationship_kind, corpus.relationship, q:vocab.relationship_kind]
    provenance: model_assisted
    reviewed: null
  - slug: stream-kind
    term: stream kind
    aliases: [fact kind]
    definition: temporal.stream_kind.code with subject_mode, subject_kinds, status_values, unit_values, requires_amount, and payload_schema. commit_batch validates slot rules.
    refs: [temporal.stream_kind, q:vocab.stream_kind]
    provenance: model_assisted
    reviewed: null
  - slug: unit-value
    term: unit value
    aliases: [unit]
    definition: Allowed unit on an amount-bearing stream, listed in stream_kind.unit_values. For model_offering_price a new series defaults its scope_key to the unit so parallel price series do not collide; an existing series keeps whatever scope_key it has.
    refs: [temporal.stream_kind, temporal.segment]
    provenance: model_assisted
    reviewed: null
  - slug: scope-key
    term: scope key
    aliases: [scopeKey, scope]
    definition: Distinguishes parallel series on the same subject and stream kind (region, unit, episode). Default is the empty string. Part of the stream unique key; the database enforces no naming convention, so a correction must reuse the existing series key.
    refs: [temporal.stream, temporal.assert_state]
    provenance: model_assisted
    reviewed: null
  - slug: tenant
    term: tenant
    aliases: [tenant_id]
    definition: Isolation key read from GUC app.tenant_id by util.current_tenant_id(). Missing context fails closed. RLS policies compare tenant_id to that function.
    refs: [util.current_tenant_id]
    provenance: model_assisted
    reviewed: null
  - slug: role
    term: role
    aliases: [bounded role]
    definition: NOLOGIN Postgres roles. app_reader sees api views and RPCs. pipeline_agent selects bounded schemas. executor_service alone executes temporal helpers and writes corpus facts.
    refs: [api.entities, temporal.assert_state]
    provenance: model_assisted
    reviewed: null
  - slug: rls
    term: RLS
    aliases: [row level security]
    definition: Enabled on tenant tables. Typical policy km_tenant_access uses tenant_id = util.current_tenant_id(). Grants without a matching tenant context return no rows or fail closed.
    refs: [util.current_tenant_id]
    provenance: model_assisted
    reviewed: null
  - slug: fingerprint
    term: fingerprint
    aliases: [workspace fingerprint, sha256]
    definition: Digest of schema structure plus vocabularies, or of workspace plus enrichment. Artifacts also carry content sha256. Ingestion intents cite workspaceFingerprint; mismatch is WORKSPACE_STALE.
    refs: [orchestration.artifact]
    provenance: model_assisted
    reviewed: null
  - slug: workspace
    term: workspace
    aliases: [schema workspace]
    definition: Generated projection of schema-ir.v1 into Markdown layers, search indexes, and the named-query catalog. Agents search then read a domain or task page; they never read schema-ir.json whole.
    refs: []
    provenance: model_assisted
    reviewed: null
  - slug: domain
    term: domain
    aliases: [L1 domain]
    definition: A curated map of 5–15 relations that belong together (identity, temporal-facts, evidence, …). Default domain for a schema is schema_domains; a relation overlay may override it.
    refs: []
    provenance: model_assisted
    reviewed: null
  - slug: task
    term: task
    aliases: [task page]
    definition: A question family with navigation, a read or ingestion operation, expected shape, and pitfalls. The shortest path from a natural-language question to a valid catalog query or intent.
    refs: []
    provenance: model_assisted
    reviewed: null
  - slug: named-query
    term: named query
    aliases: [catalog query]
    definition: An entry in the knowledge-query-catalog. Agents pass a name and params; they never send SQL. Build validation executes each example under the catalog role.
    refs: [q:entity.resolve, q:knowledge.head]
    provenance: model_assisted
    reviewed: null
  - slug: cost-class
    term: cost class
    aliases: [cheap, medium, heavy]
    definition: Catalog hint for statement_timeout and EXPLAIN gates. cheap and medium default to 15s; heavy is 60s and must not sequential-scan large relations.
    refs: [q:retrieval.hybrid_search]
    provenance: model_assisted
    reviewed: null
  - slug: hybrid-search
    term: hybrid search
    aliases: [RRF, fused search]
    definition: api.hybrid_knowledge_search_1536 fuses exact, full-text, trigram, and ANN channels with reciprocal rank fusion. Requires a published vector-space version and a query embedding computed by the executor.
    refs: [api.hybrid_knowledge_search_1536, q:retrieval.hybrid_search]
    provenance: model_assisted
    reviewed: null
  - slug: vector-space
    term: vector space
    aliases: [space, embedding space]
    definition: A named retrieval space (engineering_claims, entity_profiles, …) with versions and publications. Agents read only published versions; unpublished embeddings are invisible to hybrid search.
    refs: [retrieval.vector_space, retrieval.space_publication, retrieval.vector_item]
    provenance: model_assisted
    reviewed: null
  - slug: projection
    term: projection
    aliases: [search projection]
    definition: A derived retrieval object (search_projection, vector_item) built from documents, records, or entities. Projection rebuilding is a governed runtime operation, not an agent write.
    refs: [retrieval.search_projection, retrieval.projection_target, retrieval.vector_item]
    provenance: model_assisted
    reviewed: null
  - slug: publication
    term: publication
    aliases: [space publication]
    definition: A published vector-space version that hybrid search is allowed to read. Unpublished or inactive versions raise insufficient_privilege.
    refs: [retrieval.space_publication, api.hybrid_knowledge_search_1536]
    provenance: model_assisted
    reviewed: null
  - slug: mission
    term: mission
    aliases: [orchestration mission]
    definition: orchestration.mission is the durable work envelope. Intents and artifacts may record mission_id. Mission Control admission is out of band; this workspace only stores the id when supplied.
    refs: [orchestration.mission, orchestration.operation_intent, q:receipts.recent_for_mission]
    provenance: model_assisted
    reviewed: null
  - slug: verification-run
    term: verification run
    aliases: [sealed run]
    definition: An evidence.verification_run that must be sealed before cited claims may be materialized. Ingestion refuses EVIDENCE_NOT_ELIGIBLE for unsealed or failing verdicts.
    refs: [evidence.verification_run, evidence.claim]
    provenance: model_assisted
    reviewed: null
  - slug: locator
    term: locator
    aliases: [quote, selector]
    definition: A precise selection inside a capture (text_quote, table, media_timecode, …) with selected_content_sha256. Support rows require a locator.
    refs: [evidence.locator, evidence.source_capture]
    provenance: model_assisted
    reviewed: null
  - slug: temporal-basis
    term: temporal basis
    aliases: [temporal_basis]
    definition: Why the world interval is believed. explicit and carry_forward require an extent; observation_bounded is “true at capture time”; unresolved is an admitted gap.
    refs: [temporal.segment, temporal.extent]
    provenance: model_assisted
    reviewed: null
  - slug: belief
    term: belief
    aliases: [accepted, disputed]
    definition: accepted, disputed, or unknown on a segment or occurrence. disputed does not replace an accepted current segment; the executor plans review_required.
    refs: [temporal.segment, temporal.event_occurrence]
    provenance: model_assisted
    reviewed: null
