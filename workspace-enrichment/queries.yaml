      join research.report_package p on
      (p.tenant_id,p.report_version_id)=(v.tenant_id,v.id) left join
      research.report_package_seal s on
      (s.tenant_id,s.report_version_id)=(v.tenant_id,v.id) where
      v.tenant_id=util.current_tenant_id() and v.report_id=$1::uuid order by
      v.version desc limit 200
