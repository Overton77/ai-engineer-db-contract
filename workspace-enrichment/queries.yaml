  - name: evidence.claims_for_entity
    title: Claims that name one entity as subject, object, or context
    kind: named_query
    role: pipeline_agent
    sql: |
      select c.id, c.claim_type, c.statement, c.status, c.created_at, cs.role
      from evidence.claim c
      join evidence.claim_subject cs on cs.claim_id = c.id and cs.tenant_id = c.tenant_id
      where c.tenant_id = util.current_tenant_id()
        and cs.entity_id = $1
      order by c.created_at desc, c.id
      limit least(greatest(coalesce($2, 100), 1), 200)
    paramOrder: [entity_id, limit]
    params:
      type: object
      required: [entity_id]
      properties:
        entity_id: { type: string, format: uuid, pgType: uuid }
        limit: { type: integer, minimum: 1, maximum: 200, default: 100 }
      additionalProperties: false
    result: { shape: rows, columns: [id, claim_type, statement, status, created_at, role] }
    cost_class: cheap
    temporal: { world_time: n/a, knowledge: head }
    pagination: { kind: limit, limitParam: limit }
    volatile: false
    domain: evidence
    tasks: [what-do-we-know-about-entity, admit-support-for-claim]
    aliases: [claims]
    example: { entity_id: "0192b000-0000-7000-8000-000000000001", limit: 100 }
    execute: true
    provenance: model_assisted
    reviewed: null

