  - name: evidence.captures_for_source
    title: Captures registered for one source
    kind: named_query
    role: pipeline_agent
    sql: |
      select sc.id, sc.source_id, sc.artifact_id, sc.content_sha256, sc.capture_method,
             sc.captured_at, sc.request_url
      from evidence.source_capture sc
      where sc.tenant_id = util.current_tenant_id()
        and sc.source_id = $1
      order by sc.captured_at desc, sc.id
    paramOrder: [source_id]
    params:
      type: object
      required: [source_id]
      properties:
        source_id: { type: string, format: uuid, pgType: uuid }
