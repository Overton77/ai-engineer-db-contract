format: ai-engineer-workspace-enrichment/1
defaults:
  role: app_reader
  limit: 200
  maxLimit: 2000
  statementTimeoutMs: { cheap: 15000, medium: 15000, heavy: 60000 }
queries:
  - name: entity.resolve
    title: Find entities by name, alias, or identifier
    kind: named_query
    role: app_reader
    sql: select * from api.resolve_entity($1::text)
    paramOrder: [text]
    params:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
      additionalProperties: false
    result: { shape: rows, columns: [entity_id, kind, display_name, score] }
    cost_class: cheap
    temporal: { world_time: n/a, knowledge: head }
    pagination: null
    volatile: false
    domain: identity
    tasks: [what-do-we-know-about-entity, resolve-or-create-entity]
    aliases: [resolve, lookup]
    example: { text: OpenAI }
    execute: true
    provenance: model_assisted
    reviewed: null

  - name: entity.card
    title: Current overview of one entity
    kind: named_query
    role: app_reader
    sql: select api.entity_card($1::uuid) as card
    paramOrder: [entity_id]
    params:
      type: object
      required: [entity_id]
      properties:
        entity_id: { type: string, format: uuid, pgType: uuid }
      additionalProperties: false
    result: { shape: single_json, columns: [card] }
    cost_class: cheap
    temporal: { world_time: now(), knowledge: head }
    pagination: null
    volatile: false
    domain: identity
    tasks: [what-do-we-know-about-entity]
    aliases: [card, overview]
    example: { entity_id: "0192b000-0000-7000-8000-000000000001" }
    execute: true
    provenance: model_assisted
    reviewed: null

  - name: entity.at
    title: Facts for one entity at a world time as known at a knowledge seq
    kind: named_query
    role: app_reader
    sql: select * from api.entity_at($1::uuid, $2::timestamptz, $3::bigint)
    paramOrder: [entity_id, at, k]
    params:
      type: object
      required: [entity_id, at]
      properties:
        entity_id: { type: string, format: uuid, pgType: uuid }
        at: { type: string, format: date-time, pgType: timestamptz }
        k: { type: ["integer", "null"], pgType: bigint, default: null }
      additionalProperties: false
    result: { shape: rows, columns: [segment_id, stream_kind, scope_key, valid_during, status, amount, currency, unit, ref_entity_id, ref_display_name, payload, belief, k_from, k_to] }
    cost_class: cheap
    temporal: { world_time: param:at, knowledge: param:k }
    pagination: null
    volatile: false
    domain: temporal-facts
    tasks: [what-do-we-know-about-entity, record-price-change]
    aliases: [as of, point in time, historical facts, replay]
    example: { entity_id: "0192b000-0000-7000-8000-000000000001", at: "2026-03-15T00:00:00Z", k: 0 }
    execute: true
    provenance: model_assisted
    reviewed: null

  - name: entity.relationships
    title: Relationships touching one entity at a world time and knowledge seq
    kind: named_query
    role: app_reader
    sql: select * from api.relationships($1::uuid, $2::text, $3::timestamptz, $4::bigint, $5::text)
    paramOrder: [entity_id, kind, at, k, direction]
    params:
      type: object
      required: [entity_id]
      properties:
        entity_id: { type: string, format: uuid, pgType: uuid }
        kind: { type: ["string", "null"], default: null }
        at: { type: string, format: date-time, pgType: timestamptz, default: "2026-09-11T00:00:00Z" }
        k: { type: ["integer", "null"], pgType: bigint, default: null }
        direction: { type: string, enum: [both, outgoing, incoming], default: both }
      additionalProperties: false
    result: { shape: rows }
    cost_class: cheap
    temporal: { world_time: param:at, knowledge: param:k }
    pagination: null
    volatile: false
    domain: relationships
    tasks: [what-do-we-know-about-entity, assert-relationship]
    aliases: [graph, links]
    example:
      entity_id: "0192b000-0000-7000-8000-000000000001"
      kind: null
      at: "2026-09-11T00:00:00Z"
      k: null
      direction: both
    execute: true
    provenance: model_assisted
    reviewed: null

  - name: entity.timeline
    title: Segments, events, and unknown gaps for one entity over a world interval
    kind: named_query
    role: app_reader
    sql: select * from api.entity_timeline($1::uuid, $2::timestamptz, $3::timestamptz, $4::bigint)
    paramOrder: [entity_id, from, to, k]
    params:
      type: object
      required: [entity_id, from, to]
      properties:
        entity_id: { type: string, format: uuid, pgType: uuid }
        from: { type: string, format: date-time, pgType: timestamptz }
        to: { type: string, format: date-time, pgType: timestamptz }
        k: { type: ["integer", "null"], pgType: bigint, default: null }
      additionalProperties: false
    result: { shape: rows, columns: [item_kind, item_id, world_interval, details] }
    cost_class: medium
    temporal: { world_time: param:from, knowledge: param:k }
    pagination: null
    volatile: false
    domain: temporal-facts
    tasks: [what-do-we-know-about-entity]
    aliases: [timeline, gaps]
    example:
      entity_id: "0192b000-0000-7000-8000-000000000001"
      from: "2025-01-01T00:00:00Z"
      to: "2026-09-11T00:00:00Z"
      k: null
    execute: true
    provenance: model_assisted
    reviewed: null

  - name: entity.what_changed
    title: Opened and closed items for one entity between two knowledge heads
    kind: named_query
    role: app_reader
    sql: select * from api.what_changed($1::uuid, $2::bigint, $3::bigint)
    paramOrder: [entity_id, k_from, k_to]
    params:
      type: object
      required: [entity_id, k_from, k_to]
      properties:
        entity_id: { type: string, format: uuid, pgType: uuid }
        k_from: { type: integer, pgType: bigint }
        k_to: { type: integer, pgType: bigint }
      additionalProperties: false
    result: { shape: rows, columns: [change_kind, item_kind, item_id, knowledge_seq, details] }
    cost_class: cheap
    temporal: { world_time: n/a, knowledge: param:k_to }
    pagination: null
    volatile: false
    domain: temporal-facts
    tasks: [what-changed-since-head, check-knowledge-head]
    aliases: [diff, delta, rebase]
    example:
      entity_id: "0192b000-0000-7000-8000-000000000001"
      k_from: 0
      k_to: 0
    execute: true
    provenance: model_assisted
    reviewed: null

  - name: entity.by_identifier
    title: Find a canonical entity by external identifier scheme and value
    kind: named_query
    role: pipeline_agent
    sql: |
      select e.id as entity_id, e.kind, e.display_name, e.lifecycle, i.scheme, i.value
      from corpus.entity_identifier i
      join corpus.entity e on e.id = i.entity_id and e.tenant_id = i.tenant_id
      where i.tenant_id = util.current_tenant_id()
        and i.scheme = $1
        and i.value = $2
    paramOrder: [scheme, value]
    params:
      type: object
      required: [scheme, value]
      properties:
        scheme: { type: string, minLength: 1 }
        value: { type: string, minLength: 1 }
      additionalProperties: false
    result: { shape: rows, columns: [entity_id, kind, display_name, lifecycle, scheme, value] }
    cost_class: cheap
    temporal: { world_time: n/a, knowledge: head }
    pagination: null
    volatile: false
    domain: identity
    tasks: [find-entity-by-identifier, resolve-or-create-entity]
    aliases: [identifier, scheme lookup]
    example: { scheme: github, value: openai/openai-python }
    execute: true
    provenance: model_assisted
    reviewed: null

  - name: entity.typed_row
    title: Canonical entity plus the kind-dispatched typed child row
    kind: named_query
    role: pipeline_agent
    sql: |
      select e.id as entity_id, e.kind, e.display_name, e.slug, e.lifecycle, e.summary,
             ek.canonical_schema, ek.canonical_table,
             coalesce(
               to_jsonb(t_person), to_jsonb(t_organization), to_jsonb(t_product),
               to_jsonb(t_product_version), to_jsonb(t_product_feature), to_jsonb(t_ai_model),
               to_jsonb(t_ai_model_version), to_jsonb(t_model_offering), to_jsonb(t_technique),
               to_jsonb(t_dataset), to_jsonb(t_benchmark), to_jsonb(t_benchmark_run),
               to_jsonb(t_repository), to_jsonb(t_library), to_jsonb(t_library_release),
               to_jsonb(t_mcp_server), to_jsonb(t_agent_skill), to_jsonb(t_ai_protocol),
               to_jsonb(t_ai_protocol_version), to_jsonb(t_ai_protocol_feature), to_jsonb(t_paper),
               to_jsonb(t_media_channel), to_jsonb(t_media_series), to_jsonb(t_media_work),
               to_jsonb(t_event_series), to_jsonb(t_industry_event), to_jsonb(t_talk),
               to_jsonb(t_story), to_jsonb(t_case_study), to_jsonb(t_concept),
               to_jsonb(t_funding_round), to_jsonb(t_corporate_transaction), to_jsonb(t_registry),
               to_jsonb(t_security_advisory), to_jsonb(t_compute_device), to_jsonb(t_compute_offering)
             ) as typed_row
      from corpus.entity e
      join taxonomy.entity_kind ek on ek.code = e.kind
      left join corpus.person t_person on t_person.id = e.id
      left join corpus.organization t_organization on t_organization.id = e.id
      left join corpus.product t_product on t_product.id = e.id
      left join corpus.product_version t_product_version on t_product_version.id = e.id
      left join corpus.product_feature t_product_feature on t_product_feature.id = e.id
      left join corpus.ai_model t_ai_model on t_ai_model.id = e.id
      left join corpus.ai_model_version t_ai_model_version on t_ai_model_version.id = e.id
      left join corpus.model_offering t_model_offering on t_model_offering.id = e.id
      left join corpus.technique t_technique on t_technique.id = e.id
      left join corpus.dataset t_dataset on t_dataset.id = e.id
      left join corpus.benchmark t_benchmark on t_benchmark.id = e.id
      left join corpus.benchmark_run t_benchmark_run on t_benchmark_run.id = e.id
      left join corpus.repository t_repository on t_repository.id = e.id
      left join corpus.library t_library on t_library.id = e.id
      left join corpus.library_release t_library_release on t_library_release.id = e.id
      left join corpus.mcp_server t_mcp_server on t_mcp_server.id = e.id
      left join corpus.agent_skill t_agent_skill on t_agent_skill.id = e.id
      left join corpus.ai_protocol t_ai_protocol on t_ai_protocol.id = e.id
      left join corpus.ai_protocol_version t_ai_protocol_version on t_ai_protocol_version.id = e.id
      left join corpus.ai_protocol_feature t_ai_protocol_feature on t_ai_protocol_feature.id = e.id
      left join corpus.paper t_paper on t_paper.id = e.id
      left join corpus.media_channel t_media_channel on t_media_channel.id = e.id
      left join corpus.media_series t_media_series on t_media_series.id = e.id
      left join corpus.media_work t_media_work on t_media_work.id = e.id
      left join corpus.event_series t_event_series on t_event_series.id = e.id
      left join corpus.industry_event t_industry_event on t_industry_event.id = e.id
      left join corpus.talk t_talk on t_talk.id = e.id
      left join corpus.story t_story on t_story.id = e.id
      left join corpus.case_study t_case_study on t_case_study.id = e.id
      left join corpus.concept t_concept on t_concept.id = e.id
      left join corpus.funding_round t_funding_round on t_funding_round.id = e.id
      left join corpus.corporate_transaction t_corporate_transaction on t_corporate_transaction.id = e.id
      left join corpus.registry t_registry on t_registry.id = e.id
      left join corpus.security_advisory t_security_advisory on t_security_advisory.id = e.id
      left join corpus.compute_device t_compute_device on t_compute_device.id = e.id
      left join corpus.compute_offering t_compute_offering on t_compute_offering.id = e.id
      where e.tenant_id = util.current_tenant_id()
        and e.id = $1
        and ($2::text is null or e.kind = $2)
    paramOrder: [entity_id, kind]
    params:
      type: object
      required: [entity_id]
      properties:
        entity_id: { type: string, format: uuid, pgType: uuid }
        kind: { type: ["string", "null"], default: null }
      additionalProperties: false
    result: { shape: single_row, columns: [entity_id, kind, display_name, slug, lifecycle, summary, canonical_schema, canonical_table, typed_row] }
    cost_class: cheap
    temporal: { world_time: n/a, knowledge: head }
    pagination: null
    volatile: false
    domain: identity
    tasks: [what-do-we-know-about-entity, resolve-or-create-entity]
    aliases: [typed row, kind row]
    example: { entity_id: "0192b000-0000-7000-8000-000000000001", kind: organization }
    execute: true
    provenance: model_assisted
    reviewed: null

  - name: facts.current_by_stream
    title: Current facts (k_to is null and valid_during contains now) by stream kind
    kind: named_query
    role: app_reader
    sql: |
      select id, stream_id, stream_kind, subject_entity_id, subject_relationship_id, scope_key,
             valid_during, status, amount, currency, unit, belief, temporal_basis, k_from, k_to, payload
      from api.current_facts
      where ($1::text is null or stream_kind = $1)
        and ($2::uuid is null or subject_entity_id = $2)
      order by stream_kind, scope_key, id
      limit least(greatest(coalesce($3, 50), 1), 200)
    paramOrder: [stream_kind, entity_id, limit]
    params:
      type: object
      properties:
        stream_kind: { type: ["string", "null"], default: null }
        entity_id: { type: ["string", "null"], format: uuid, pgType: uuid, default: null }
        limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
      additionalProperties: false
    result: { shape: rows }
    cost_class: cheap
    temporal: { world_time: now(), knowledge: head }
    pagination: { kind: limit, limitParam: limit }
    volatile: false
    domain: temporal-facts
    tasks: [record-price-change, record-availability-change]
    aliases: [current facts]
    example: { stream_kind: model_offering_price, entity_id: null, limit: 50 }
    execute: true
    provenance: model_assisted
    reviewed: null

  - name: facts.history_for_stream
    title: All segments on one entity stream slot, including closed history
    kind: named_query
    role: pipeline_agent
    sql: |
      select s.id, s.valid_during, s.k_from, s.k_to, s.status, s.amount, s.currency, s.unit,
             s.belief, s.temporal_basis, s.replaces_segment_id, st.scope_key
      from temporal.segment s
      join temporal.stream st on st.id = s.stream_id and st.tenant_id = s.tenant_id
      where s.tenant_id = util.current_tenant_id()
        and st.subject_entity_id = $1
        and st.kind = $2
        and st.scope_key = coalesce($3, '')
      order by s.k_from, lower(s.valid_during)
      limit least(greatest(coalesce($4, 50), 1), 200)
      offset greatest(coalesce($5, 0), 0)
    paramOrder: [entity_id, stream_kind, scope_key, limit, offset]
    params:
      type: object
      required: [entity_id, stream_kind]
      properties:
        entity_id: { type: string, format: uuid, pgType: uuid }
        stream_kind: { type: string, minLength: 1 }
        scope_key: { type: ["string", "null"], default: "" }
        limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
        offset: { type: integer, minimum: 0, default: 0 }
      additionalProperties: false
    result: { shape: rows }
    cost_class: medium
    temporal: { world_time: history, knowledge: all }
    pagination: { kind: offset, limitParam: limit, offsetParam: offset }
    volatile: false
    domain: temporal-facts
    tasks: [supersede-stale-fact, record-price-change]
    aliases: [stream history]
    example:
      entity_id: "0192b000-0000-7000-8000-000000000001"
      stream_kind: model_offering_price
      scope_key: per_1m_input_tokens
      limit: 50
      offset: 0
    execute: true
    provenance: model_assisted
    reviewed: null

  - name: events.current_for_entity
    title: Current event occurrences for one subject entity
    kind: named_query
    role: app_reader
    sql: |
      select event_id, kind, subject_entity_id, object_entity_id, occurrence_id,
             occurred_during, occurrence_mode, payload
      from api.events_current
      where subject_entity_id = $1
      order by lower(occurred_during) desc, event_id
    paramOrder: [entity_id]
    params:
      type: object
      required: [entity_id]
      properties:
        entity_id: { type: string, format: uuid, pgType: uuid }
      additionalProperties: false
    result: { shape: rows }
