    reviewed: null

  - slug: verify-ingestion-result
    title: Verify what an ingestion actually changed
    domains: [temporal-facts, orchestration-ledger]
    queries: [receipts.for_intent, knowledge.head, entity.what_changed, facts.history_for_stream, artifacts.by_type]
    aliases: [receipt, verify write, post-ingest check]
    navigation: |
      `tasks/compose-ingestion-intent.md` → `q:receipts.for_intent` → `q:entity.what_changed`
    operation: |
      Take `knowledgeHead.before` and `knowledgeHead.after` from the receipt and diff every subject between them.

      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "verify-codex-2026-09-11",
        "operations": [
          { "opId": "receipt", "kind": "named_query", "query": "receipts.for_intent", "params": { "intent_id": "0192c000-0000-7000-8000-000000000001" } },
          { "opId": "head", "kind": "named_query", "query": "knowledge.head" },
          { "opId": "changed", "kind": "named_query", "query": "entity.what_changed", "params": { "entity_id": "0192b000-0000-7000-8000-000000000011", "k_from": 4, "k_to": 5 } },
          { "opId": "price_history", "kind": "named_query", "query": "facts.history_for_stream", "params": { "entity_id": "0192b000-0000-7000-8000-000000000011", "stream_kind": "model_offering_price", "scope_key": "per_1m_input_tokens", "limit": 5, "offset": 0 } }
        ]
      }
      ```
    expected_shape: |
      `receipt`: one row with `receipt_id`, `outcome`, `knowledge_seq`. `changed`: one `opened` row per new segment/relationship/event and one `closed` row per superseded segment. A correction shows exactly one `closed` and one `opened` on the same `scope_key`; only `opened` rows mean you created a parallel fact instead of superseding.
    pitfalls: |
      The receipt is the record; the agent's own log is not. Zero `closed` rows after a "stale fix" is a failed fix. Do not re-apply the intent to "make sure": the same `intentId` is `duplicateOf`. Cite `receipt_id` and `knowledgeHead.after` in the report.
    provenance: model_assisted
    reviewed: null

  - slug: navigate-report
    title: Navigate a report revision, evidence and coverage
    domains:
      - research
      - evidence
    queries:
      - reports.versions
      - reports.sections
      - reports.assertions
      - reports.questions
      - reports.dependencies
      - reports.artifacts
      - reports.assessments
      - reports.ingestion_links
    aliases:
      - report structure
      - report outline
      - report gaps
      - section reuse
      - report evidence
    navigation: "`domains/research.md` → choose the named query below; read only the
      relation needed for the question."
    operation: >-
      Use reports.versions with report_id to choose an exact revision, including
      legacy versions. All other reports.* queries take report_version_id.


      Use reports.sections for the ordered outline, reports.assertions for exact
      spans and claim bindings, reports.questions for coverage,
      reports.dependencies for reuse context, reports.artifacts for registered
      renditions, reports.assessments for later verification links, and
      reports.ingestion_links for receipts.


      For the assembled v1 package use `knowledge report get <reportVersionId>`;
      resolve returned artifacts through `knowledge artifact get <artifactId>`.
      Named queries execute as pipeline_agent under the caller tenant.
    expected_shape: Bounded rows (at most 200 per query). Assertion and question
      joins may return multiple rows per item. A null schema_version from
      reports.versions denotes a legacy revision. Section projections carry
      pointers; readable blocks live in the structure/Markdown artifacts.
    pitfalls: A bounded slice is not a complete package export. Sealed does not mean
      admitted; missing assessments are not passing verdicts. Do not treat claim
      bindings as independent corroboration or infer an answer from coverage
      alone.
    provenance: model_assisted
    reviewed: null
  - slug: register-report
    title: Register an immutable report package revision
    domains:
      - research
      - orchestration-ledger
    queries:
      - reports.versions
      - reports.artifacts
    aliases:
      - report registration
      - incremental report
      - post research report
    navigation: "`domains/research.md` → `research.report_package` →
      `research.report_package_seal`."
    operation: >-
      Author research-report.v1 with report/revision identity, scope, cutoff,
      producer, ordered sections, blocks, assertions, run-qualified evidence
      references and original-question coverage. Call `knowledge report register
      report.json` (MCP report_register). Both incremental and post_research
      authoring support an optional mission.


      Register a new immutable revision for changed content. KS renders final
      Markdown spans, verifies artifact readback and registers projections
      transactionally. Follow `knowledge report get <reportVersionId>` to
      inspect the result.
    expected_shape: "Registration reports sealed or storage_pending and admission:
      not_evaluated. A sealed revision has structure, Markdown and manifest
      artifacts plus structural projections. Post-seal assessments and ingestion
      links remain separate lifecycle records."
    pitfalls: Do not insert projections directly or invent producer attempts.
      storage_pending needs actual storage reconciliation. Registration is
      separate from legacy report.publish and from verification/admission.
      Attach reportBinding to normal ingestion proposals to retain receipt
      lineage.
    provenance: model_assisted
    reviewed: null
