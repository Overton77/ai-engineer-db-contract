format: ai-engineer-workspace-enrichment/1
version: ingestion-rules.v1
rules:
  - id: price.scope_key_is_unit
    title: A new price series defaults its scope_key to the unit; an existing series keeps its key
    basis: curated
    applies_to: { proposal_kind: fact.assert_state, stream_kind: model_offering_price }
    action: rewrite
    detail: |
      Two `model_offering_price` facts on the same subject and world interval do not collide
      only when `scope_key` distinguishes them, so a **new** series with no `scopeKey` is
      rewritten to the proposal `unit` (for example `per_1m_input_tokens`); the exclusion
      constraint `segment_stream_id_valid_during_excl` would otherwise reject the second
      current segment. The database does not enforce any naming convention for `scope_key`:
      a series that already exists for the same subject, stream, and unit keeps whatever
      `scope_key` it was created with (older data uses keys such as `input_tokens`). Read
      `q:facts.current_by_stream` first; if a current segment with the same unit exists under
      another `scope_key`, name that key explicitly, or the stale segment stays current beside
      your new one. Allowed units are the unit_values on `temporal.stream_kind:model_offering_price`.
    refs: [temporal.stream_kind:model_offering_price, temporal.segment, temporal.stream]
    provenance: model_assisted
    reviewed: null

  - id: availability.transitions_are_ordered
    title: Availability transitions are ordered
    basis: curated
    applies_to: { proposal_kind: fact.assert_state, stream_kind: model_offering_availability }
    action: hold
    detail: |
      `temporal.stream_kind:model_offering_availability` admits statuses announced, preview,
      ga, deprecated, retired. The database does not order them. Hold a proposal that would
      move a current status backward along that sequence unless the evidence is an explicit
      correction with `temporal_basis=explicit` and a replacing interval. The same order
      applies to `temporal.stream_kind:product_feature_availability` (removed instead of retired).
    refs: [temporal.stream_kind:model_offering_availability, temporal.stream_kind:product_feature_availability, temporal.segment]
    provenance: model_assisted
    reviewed: null

  - id: entity.kind_in_vocabulary
    title: Entity kind must be in vocabulary
    basis: enforced
    applies_to: { proposal_kind: entity.create }
    action: reject
    detail: |
      `corpus.entity.kind` references `taxonomy.entity_kind(code)` via `entity_kind_fkey`.
      A `new` subject whose kind is not a vocabulary code is rejected before a batch opens
      (`VOCABULARY_VIOLATION`). Typed payloads must use columns of that kind's
      `canonical_table`.
    refs: [corpus.entity, taxonomy.entity_kind]
    provenance: model_assisted
    reviewed: null

  - id: relationship.kinds_constrain_endpoints
    title: Relationship kinds constrain entity kinds
    basis: enforced
    applies_to: { proposal_kind: relationship.assert }
    action: reject
    detail: |
      Trigger `relationship_kinds` on `corpus.relationship` runs
      `corpus.check_relationship_kinds` and raises if the from/to entity kinds are not in
      `taxonomy.relationship_kind.from_kinds` / `to_kinds`. `version_of` additionally requires
      a matching pair (product_version/product, ai_model_version/ai_model, …).
    refs: [corpus.relationship, taxonomy.relationship_kind, temporal.assert_relationship]
    provenance: model_assisted
    reviewed: null

  - id: fact.world_time_required
    title: World-time required on facts
    basis: enforced
    applies_to: { proposal_kind: fact.assert_state }
    action: reject
    detail: |
      `temporal.segment.valid_during` is `not null` and `segment_valid_during_check` requires
      a non-empty `[)` range bounded below. Events use the same shape on
      `temporal.event_occurrence.occurred_during`. A proposal without `worldInterval.from`
      is rejected.
    refs: [temporal.segment, temporal.event_occurrence, temporal.assert_state]
    provenance: model_assisted
    reviewed: null

  - id: support.must_precede_claim_use
    title: Support must precede claim materialization of a fact
    basis: curated
    applies_to: { proposal_kind: fact.assert_state }
    action: hold
    detail: |
      A fact may cite `primary_claim_id` only after the claim exists. The executor implies
      claim.materialize for cited claims not yet in `evidence.claim`, then admits
      support.admit through `temporal.admit_support`. `segment_support_claim_id_fkey` and
      `segment_primary_claim_id_fkey` enforce the FK once rows exist; the ordering is an
      executor rule so agents get a readable plan instead of a mid-batch FK failure.
    refs: [evidence.claim, evidence.segment_support, temporal.admit_support, temporal.segment]
    provenance: model_assisted
    reviewed: null

  - id: stage.when_confidence_below_threshold
    title: Stage when identity confidence is below threshold
    basis: curated
    applies_to: { proposal_kind: entity.create }
    action: stage
    detail: |
      If `api.resolve_entity` or an identifier lookup scores below the configured threshold
      (default 0.98 on identifier, lower on alias), rewrite entity.create to
      candidate.stage with reason `identity_ambiguous` unless the intent says
      `onMatch: use_existing`. `staging.candidate.proposed_kind` still must be a
      `taxonomy.entity_kind` (`candidate_proposed_kind_fkey`).
    refs: [staging.candidate, api.resolve_entity, taxonomy.entity_kind]
    provenance: model_assisted
    reviewed: null

  - id: segment.do_not_close_without_later_world_time
    title: Do not close a segment without a later world-time
    basis: curated
    applies_to: { proposal_kind: fact.assert_state }
    action: reject
    detail: |
      Closing a current segment (`k_to` set) without asserting a successor that starts at or
      after the close instant leaves a world-time hole. `api.entity_timeline` will emit
      `unknown` gaps. Reject a close-only proposal that does not supply a later
      `worldInterval.from`. `temporal.close_segment` only stamps knowledge time; it does not
      invent a replacement fact.
    refs: [temporal.close_segment, temporal.segment, q:entity.timeline]
    provenance: model_assisted
    reviewed: null

  - id: proposal.idempotent_repeat
    title: Repeated identical proposals are no-ops
    basis: enforced
    applies_to: { proposal_kind: fact.assert_state }
    action: note
    detail: |
      `temporal.assert_state` returns the existing segment id when an identical current
      segment exists. `temporal.knowledge_batch` is unique on `(tenant_id, idempotency_key)`
      (`knowledge_batch_tenant_id_idempotency_key_key`). A second submit of the same intent
      bytes returns `duplicate_of` without opening a new batch.
    refs: [temporal.assert_state, temporal.knowledge_batch, orchestration.operation_intent]
    provenance: model_assisted
    reviewed: null

  - id: alias.must_not_collide_canonical
    title: Alias must not collide with another canonical entity
    basis: curated
    applies_to: { proposal_kind: entity.alias }
    action: reject
    detail: |
      `entity_alias_tenant_id_entity_id_alias_normalized_alias_kin_key` is unique per entity,
      not globally. The same alias string may exist on two entities. The executor rejects an
      alias that `api.resolve_entity` matches to a different active canonical entity at
      score ≥ 0.98, so agents do not silently attach a well-known name to the wrong id.
    refs: [corpus.entity_alias, corpus.entity, api.resolve_entity]
    provenance: model_assisted
    reviewed: null

  - id: identifier.namespace_in_vocabulary
    title: Identifier namespace must be in vocabulary
    basis: enforced
    applies_to: { proposal_kind: entity.identifier }
    action: reject
    detail: |
      `entity_identifier_scheme_check` restricts `scheme` to the closed list
      (wikidata, ror, orcid, github, huggingface, npm, pypi, crates, go_module, doi, arxiv,
      openreview, mcp_registry, cve, ghsa, spdx, crunchbase, pitchbook, linkedin, x,
      youtube_channel, youtube_playlist, youtube_video, spotify, apple_podcasts, domain,
      sec_cik, lei, isin, other). `entity_identifier_tenant_id_scheme_value_key` makes
      `(scheme, value)` unique per tenant.
    refs: [corpus.entity_identifier]
    provenance: model_assisted
    reviewed: null

  - id: write.expected_head_required
    title: expected_head required for writes
    basis: enforced
    applies_to: { proposal_kind: fact.assert_state }
    action: reject
    detail: |
      `temporal.begin_batch(p_expected_head)` locks `temporal.knowledge_head` and raises
      `rebase_required` (SQLSTATE 40001) when `p_expected_head` is not null and does not
      equal the current `knowledge_seq`. The ingestion executor always passes the snapshot
      head. A write without `expectedKnowledgeHead` is rejected at plan time so a stale
      snapshot cannot silently land.
    refs: [temporal.begin_batch, temporal.knowledge_head, q:knowledge.head]
    provenance: model_assisted
    reviewed: null

  - id: price.currency_iso4217
    title: Monetary streams require ISO-4217 currency
    basis: enforced
    applies_to: { proposal_kind: fact.assert_state, stream_kind: model_offering_price }
    action: reject
    detail: |
      `temporal.commit_batch` requires `currency ~ '^[A-Z]{3}$'` for
      `model_offering_price`, `compute_offering_price`, and `valuation`. Amount and a
      unit from `unit_values` are also required (`requires_amount`).
    refs: [temporal.stream_kind:model_offering_price, temporal.commit_batch, temporal.segment]
    provenance: model_assisted
    reviewed: null
