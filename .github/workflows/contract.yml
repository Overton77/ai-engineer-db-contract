name: Database contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run types:check
      - run: npm test
      # Committed workspace must match the reset database (structure, grants, vocabularies, generated types).
      - run: npm run workspace:check -- --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Committed pages must re-render byte-for-byte from the committed IR, and every catalog example must execute.
      - run: npm run workspace:validate -- --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
